<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="28" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="28" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="28" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- three glowing bars = 三核 -->
  <g filter="url(#glow)">
    <rect x="10" y="8" width="28" height="5" rx="2.5" fill="url(#g1)"/>
    <rect x="10" y="21" width="28" height="5" rx="2.5" fill="url(#g2)"/>
    <rect x="10" y="34" width="28" height="5" rx="2.5" fill="url(#g3)"/>
  </g>
  <!-- accent dots -->
  <circle cx="10" cy="10.5" r="2" fill="#c084fc"/>
  <circle cx="38" cy="10.5" r="2" fill="#c084fc"/>
  <circle cx="10" cy="23.5" r="2" fill="#e879f9"/>
  <circle cx="38" cy="36.5" r="2" fill="#f472b6"/>
</svg>
